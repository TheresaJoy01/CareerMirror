<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerMirror - Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <!-- Background decorations -->
    <div class="bg-circle circle-top"></div>
    <div class="bg-circle circle-left"></div>
    <div class="bg-circle circle-bottom"></div>


    <!-- Header -->
    <header class="header">

        <div class="logo">

            <div class="logo-mark">
                <span>C</span>
            </div>

            <span class="logo-text">CareerMirror</span>

        </div>

    </header>


    <!-- Main -->
    <main>

        <!-- Page heading -->
        <section class="intro">

            <div class="profile-icon">

                <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">

                    <circle
                        cx="40"
                        cy="27"
                        r="14"
                        fill="#5B5BEF"
                    />

                    <path
                        d="M18 65C18 50 27 43 40 43C53 43 62 50 62 65"
                        fill="#5B5BEF"
                    />

                </svg>


                <div class="edit-icon">

                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                        <path
                            d="M15.5 5.5L18.5 8.5M5 19L6 15L15 6L18 9L9 18L5 19Z"
                            fill="none"
                            stroke="white"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </div>

            </div>


            <div>

                <h1>Tell us about yourself</h1>

                <p>
                    This helps us understand your current skills.
                </p>

            </div>

        </section>


        <!-- Profile Card -->
        <section class="profile-card">


            <!-- Name -->
            <div class="field-section">

                <label class="section-label">

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="12"
                            cy="8"
                            r="4"
                        ></circle>

                        <path
                            d="M4 21C4 16.5 7 14 12 14C17 14 20 16.5 20 21"
                        ></path>

                    </svg>

                    Name

                </label>


                <input
                    type="text"
                    id="name"
                    placeholder=""
                >

            </div>


            <!-- Skills -->
            <div class="field-section">

                <label class="section-label blue-label">

                    <svg viewBox="0 0 24 24">

                        <path d="M8 7L3 12L8 17"></path>

                        <path d="M16 7L21 12L16 17"></path>

                        <path d="M14 4L10 20"></path>

                    </svg>

                    YOUR SKILLS

                </label>


                <div
                    class="input-box skills-box"
                    id="skillsBox"
                >

                    <button
                        type="button"
                        class="add-btn"
                        onclick="addSkill()"
                    >

                        <span>+</span>

                        Add Skill

                    </button>

                </div>

            </div>


            <!-- Projects -->
            <div class="field-section">

                <label class="section-label blue-label">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M3 7C3 5.9 3.9 5 5 5H10L12 7H19C20.1 7 21 7.9 21 9V18C21 19.1 20.1 20 19 20H5C3.9 20 3 19.1 3 18V7Z"
                        ></path>

                    </svg>

                    PROJECTS

                </label>


                <div
                    class="input-box projects-box"
                    id="projectsBox"
                >

                    <button
                        type="button"
                        class="add-btn project-add"
                        onclick="addProject()"
                    >

                        <span>+</span>

                        Add Project

                    </button>

                </div>

            </div>


            <!-- Certifications -->
            <div class="field-section certification-section">

                <label class="section-label blue-label">

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="12"
                            cy="9"
                            r="6"
                        ></circle>

                        <path
                            d="M9 15L8 21L12 19L16 21L15 15"
                        ></path>

                        <path
                            d="M10 9L11.3 10.3L14 7.7"
                        ></path>

                    </svg>

                    CERTIFICATIONS

                </label>


                <div
                    class="input-box certification-box"
                    id="certificationBox"
                >

                    <button
                        type="button"
                        class="add-btn"
                        onclick="addCertification()"
                    >

                        <span>+</span>

                        Add Certification

                    </button>

                </div>

            </div>


            <!-- Continue -->
            <div class="continue-container">

                <button
                    type="button"
                    class="continue-btn"
                    onclick="continueProfile()"
                >

                    Continue

                    <span>→</span>

                </button>

            </div>


        </section>

    </main>


    <!-- Input Modal -->
    <div
        class="modal-overlay"
        id="inputModal"
    >

        <div class="modal">


            <button
                type="button"
                class="modal-close"
                onclick="closeModal()"
            >
                ×
            </button>


            <h2 id="modalTitle">
                Add Skill
            </h2>


            <p id="modalDescription">
                Enter the skill you want to add.
            </p>


            <input
                type="text"
                id="modalInput"
                placeholder="Enter here..."
                autocomplete="off"
            >


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    class="save-btn"
                    onclick="saveModalInput()"
                >
                    Add
                </button>

            </div>

        </div>

    </div>


    <script src="profile.js"></script>

</body>
</html>
