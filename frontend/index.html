<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerMirror</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <!-- Logo -->
        <header class="logo">
            <div class="logo-mark">
                C
                <span>✦</span>
            </div>

            <div class="logo-name">
                CareerMirror
            </div>
        </header>


        <!-- Hero -->
        <section class="hero">

            <div class="hero-left">

                <h1>
                    Your Skills. Your Career.
                    <br>
                    <span>Your Next Step.</span>
                </h1>

                <p>
                    Discover how ready you are for your dream tech career.
                    <br>
                    Identify skill gaps. Get a personalized roadmap.
                </p>

                <!-- LINK TO LOGIN PAGE -->
                <a href="login.html" class="journey-button" id="journeyButton" style="text-decoration: none; display: inline-flex;">
                    <span class="sparkles">✦</span>
                    <span>Start Your Journey</span>
                    <span class="arrow">→</span>
                </a>

            </div>


            <!-- Right-side illustration -->
            <div class="hero-right">
                <img
                    src="assests/career-illustration.png"
                    alt="CareerMirror illustration"
                >
            </div>

                

                <!-- Illustration -->
                <div class="illustration">

                    <div class="plant">
                        <div class="leaf leaf-1"></div>
                        <div class="leaf leaf-2"></div>
                        <div class="leaf leaf-3"></div>

                        <div class="pot"></div>
                    </div>


                    <div class="person">

                        <div class="hair"></div>

                        <div class="head">
                            <div class="eye eye-left"></div>
                            <div class="eye eye-right"></div>

                            <div class="nose"></div>

                            <div class="mouth"></div>
                        </div>

                        <div class="neck"></div>

                        <div class="hoodie">

                            <div class="hoodie-string string-left"></div>
                            <div class="hoodie-string string-right"></div>

                        </div>

                        <div class="left-arm"></div>
                        <div class="right-arm"></div>

                    </div>


                    <!-- Laptop -->
                    <div class="laptop">

                        <div class="screen">

                            <div class="camera"></div>

                            <div class="screen-lines">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>

                        </div>

                        <div class="keyboard">

                            <div class="trackpad"></div>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- How it works -->
        <section class="how-it-works">

            <div class="section-heading">

                <span class="line"></span>

                <h2>HOW IT WORKS</h2>

                <span class="line"></span>

            </div>


            <div class="steps">

                <!-- Step 1 -->
                <div class="step">

                    <div class="step-number purple-number">
                        01
                    </div>

                    <div class="step-icon purple-icon">
                        ♙
                    </div>

                    <h3>
                        Tell us
                        <br>
                        about you
                    </h3>

                </div>


                <div class="step-arrow">
                    →
                </div>


                <!-- Step 2 -->
                <div class="step">

                    <div class="step-number blue-number">
                        02
                    </div>

                    <div class="step-icon blue-icon">
                        ◎
                    </div>

                    <h3>
                        Choose your
                        <br>
                        target role
                    </h3>

                </div>


                <div class="step-arrow">
                    →
                </div>


                <!-- Step 3 -->
                <div class="step">

                    <div class="step-number green-number">
                        03
                    </div>

                    <div class="step-icon green-icon">
                        ⌖
                    </div>

                    <h3>
                        Get your
                        <br>
                        roadmap
                    </h3>

                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
