<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerMirror - Career Analysis</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="analysis.css">
</head>

<body>

    <!-- Background shapes -->
    <div class="bg-shape bg-top-left"></div>
    <div class="bg-shape bg-bottom-left"></div>
    <div class="bg-shape bg-bottom-right"></div>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                <span>C</span>
            </div>

            <span class="logo-text">
                CareerMirror
            </span>

        </div>


        <div class="career-badge">

            <svg viewBox="0 0 24 24">
                <rect x="5" y="7" width="14" height="12" rx="2"></rect>

                <path d="M9 7V5C9 4.4 9.4 4 10 4H14C14.6 4 15 4.4 15 5V7"></path>

                <circle cx="9" cy="12" r="1"></circle>
                <circle cx="15" cy="12" r="1"></circle>

                <path d="M9 16C10 17 14 17 15 16"></path>

                <path d="M3 10V15"></path>
                <path d="M21 10V15"></path>
            </svg>

            <span>AI/ML Engineer</span>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main>


        <!-- =========================
             INTRO
        ========================== -->

        <section class="intro">

            <div class="intro-text">

                <h1>
                    <span class="wave">👋</span>
                    Hi Theresa
                    <span class="wave">👋</span>
                </h1>

                <p>
                    Here’s your career readiness analysis.
                </p>

            </div>


            <!-- Your image -->
            <div class="illustration">

                <img
                    src="assests/career-girl.png"
                    alt="Career analysis illustration">

            </div>

        </section>



        <!-- =========================
             CAREER READINESS
        ========================== -->

        <section class="readiness-card">

            <div class="progress-ring">

                <svg viewBox="0 0 180 180">

                    <circle
                        class="ring-background"
                        cx="90"
                        cy="90"
                        r="72">
                    </circle>

                    <circle
                        class="ring-progress"
                        cx="90"
                        cy="90"
                        r="72">
                    </circle>

                </svg>


                <div class="percentage">

                    <strong>64%</strong>

                    <span>
                        Career Ready
                    </span>

                </div>

            </div>

        </section>



        <!-- =========================
             STRENGTHS + GAPS
        ========================== -->

        <section class="analysis-grid">


            <!-- STRENGTHS -->

            <div class="analysis-card strengths-card">

                <div class="card-title strengths-title">

                    <div class="title-icon check-icon">
                        ✓
                    </div>

                    <span>
                        YOUR STRENGTHS
                    </span>

                </div>


                <!-- Python -->

                <div class="skill-row">

                    <div class="skill-name">
                        Python
                    </div>

                    <div class="skill-bar">

                        <div
                            class="skill-fill purple-fill"
                            style="width: 90%;">
                        </div>

                    </div>

                    <div class="score strength-score">
                        90%
                    </div>

                </div>


                <!-- Git -->

                <div class="skill-row">

                    <div class="skill-name">
                        Git
                    </div>

                    <div class="skill-bar">

                        <div
                            class="skill-fill blue-fill"
                            style="width: 80%;">
                        </div>

                    </div>

                    <div class="score strength-score">
                        80%
                    </div>

                </div>


                <!-- Pandas -->

                <div class="skill-row">

                    <div class="skill-name">
                        Pandas
                    </div>

                    <div class="skill-bar">

                        <div
                            class="skill-fill purple-fill"
                            style="width: 70%;">
                        </div>

                    </div>

                    <div class="score strength-score">
                        70%
                    </div>

                </div>

            </div>



            <!-- SKILL GAPS -->

            <div class="analysis-card gaps-card">

                <div class="card-title gaps-title">

                    <div class="title-icon warning-icon">
                        !
                    </div>

                    <span>
                        SKILL GAPS
                    </span>

                </div>


                <!-- Machine Learning -->

                <div class="skill-row">

                    <div class="skill-name">
                        Machine Learning
                    </div>

                    <div class="skill-bar">

                        <div
                            class="skill-fill pink-fill"
                            style="width: 35%;">
                        </div>

                    </div>

                    <div class="score gap-score">
                        35%
                    </div>

                </div>


                <!-- Statistics -->

                <div class="skill-row">

                    <div class="skill-name">
                        Statistics
                    </div>

                    <div class="skill-bar">

                        <div
                            class="skill-fill pink-fill"
                            style="width: 30%;">
                        </div>

                    </div>

                    <div class="score gap-score">
                        30%
                    </div>

                </div>


                <!-- TensorFlow -->

                <div class="skill-row">

                    <div class="skill-name">
                        TensorFlow
                    </div>

                    <div class="skill-bar">

                        <div
                            class="skill-fill pink-fill"
                            style="width: 0%;">
                        </div>

                    </div>

                    <div class="score gap-score">
                        0%
                    </div>

                </div>

            </div>

        </section>



        <!-- =========================
             TOP PRIORITY
        ========================== -->

        <section class="priority-card">

            <div class="priority-title">

                <span class="fire-icon">
                    🔥
                </span>

                <span>
                    TOP PRIORITY
                </span>

            </div>


            <div class="priority-content">


                <!-- Target icon -->

                <div class="target-icon">

                    <div class="target-circle">

                        <div class="target-dot"></div>

                    </div>

                    <div class="target-arrow">
                        ↗
                    </div>

                </div>


                <!-- Priority information -->

                <div class="priority-info">

                    <h2>
                        Machine Learning
                    </h2>


                    <div class="priority-details">

                        <span class="gap-label">
                            Your gap:
                        </span>

                        <span class="gap-pill">
                            55%
                        </span>

                        <span class="separator">
                            |
                        </span>

                        <span class="importance-label">
                            Importance:
                        </span>

                        <span class="high-pill">
                            HIGH
                        </span>

                    </div>

                </div>


                <!-- Arrow -->

                <div class="priority-arrow">
                    ›
                </div>

            </div>

        </section>



        <!-- =========================
             ROADMAP BUTTON
        ========================== -->

        <div class="roadmap-container">

            <button
                class="roadmap-btn"
                onclick="viewRoadmap()">

                <span class="sparkles">
                    ✦
                </span>

                <span>
                    View My Roadmap
                </span>

                <span class="roadmap-arrow">
                    →
                </span>

            </button>

        </div>

    </main>


    <script src="analysis.js"></script>

</body>

</html>
